<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Arondyte Editor</title>
<link rel="icon" href="/media/site/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Syncopate:wght@400;700&display=swap">
<style>
:root { --bg:#000; --panel:#0a0c0e; --raise:#111417; --line:#1d2327; --text:#d9d9d6; --dim:#8b9296; --faint:#5a6266; --steel:#3f7490; --steel-hi:#5b97b8; --bad:#d9704f; --ok:#8fbfa6; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:400 14px/1.45 Jost, system-ui, sans-serif; }
button, input, textarea, select { font:inherit; color:inherit; }
a { color:var(--steel-hi); }
.app { display:grid; grid-template-rows:56px 1fr; height:100%; }
.top { display:flex; align-items:center; gap:16px; padding:0 18px; border-bottom:1px solid var(--line); background:var(--panel); }
.top .brand { font:700 11px/1 Syncopate, sans-serif; letter-spacing:.22em; text-transform:uppercase; white-space:nowrap; }
.top .brand i { font-style:normal; color:var(--steel-hi); }
.top .sp { flex:1; }
.status { font-size:12px; letter-spacing:.06em; color:var(--dim); }
.status.dirty { color:#ffcf8a; }
.status.ok { color:var(--ok); }
.btn { background:none; border:1px solid var(--line); color:var(--text); padding:8px 14px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; cursor:pointer; border-radius:2px; }
.btn:hover { border-color:var(--steel); color:#fff; }
.btn:disabled { opacity:.35; cursor:default; border-color:var(--line); color:var(--dim); }
.btn.pri { background:var(--steel); border-color:var(--steel); color:#fff; }
.btn.pri:hover { background:var(--steel-hi); border-color:var(--steel-hi); }
.btn.pri:disabled { background:#16303d; border-color:#16303d; color:#6e8a98; }
.btn.sm { padding:5px 9px; font-size:10px; }
.btn.bad:hover { border-color:var(--bad); color:var(--bad); }
.body { display:grid; grid-template-columns:230px minmax(360px, 560px) 1fr; min-height:0; }
.side { border-right:1px solid var(--line); background:var(--panel); overflow:auto; padding:14px 0 24px; }
.side h4 { margin:18px 18px 8px; font:400 10px/1 Jost; letter-spacing:.24em; text-transform:uppercase; color:var(--faint); }
.side .item { display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:0; border-left:2px solid transparent; padding:9px 16px 9px 16px; cursor:pointer; color:var(--dim); }
.side .item:hover { color:var(--text); background:var(--raise); }
.side .item.on { color:#fff; border-left-color:var(--steel); background:var(--raise); }
.side .item small { margin-left:auto; color:var(--faint); font-size:11px; }
.side .add { margin:10px 16px 0; }
.conn { margin:22px 16px 0; padding-top:14px; border-top:1px solid var(--line); font-size:12px; color:var(--dim); }
.conn b { color:var(--text); font-weight:500; }
.main { overflow:auto; padding:22px 26px 80px; border-right:1px solid var(--line); }
.main h2 { margin:0 0 4px; font:700 13px/1.3 Syncopate, sans-serif; letter-spacing:.14em; text-transform:uppercase; }
.main .sub { margin:0 0 22px; color:var(--dim); font-size:13px; }
fieldset { border:0; border-top:1px solid var(--line); margin:26px 0 0; padding:16px 0 0; }
legend { padding:0 10px 0 0; font:400 10px/1 Jost; letter-spacing:.26em; text-transform:uppercase; color:var(--steel-hi); }
.f { display:block; margin:0 0 14px; }
.f > span { display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-bottom:5px; }
.f > small { display:block; color:var(--faint); font-size:12px; margin-top:4px; }
input[type=text], input[type=url], input[type=number], input[type=email], textarea, select { width:100%; background:var(--raise); border:1px solid var(--line); border-radius:2px; padding:9px 10px; outline:none; }
input:focus, textarea:focus, select:focus { border-color:var(--steel); }
textarea { resize:vertical; min-height:70px; line-height:1.5; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.chk { display:flex; align-items:center; gap:9px; margin:0 0 14px; cursor:pointer; }
.chk input { accent-color:var(--steel); width:16px; height:16px; }
.media { display:flex; gap:14px; align-items:flex-start; margin-bottom:14px; }
.thumb { width:120px; aspect-ratio:16/10; background:var(--raise); border:1px solid var(--line); object-fit:cover; flex:none; }
.thumb.contain { object-fit:contain; background:#1a1f22; }
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
.card { border:1px solid var(--line); background:var(--raise); padding:8px; display:flex; flex-direction:column; gap:7px; }
.card img { width:100%; aspect-ratio:16/10; object-fit:cover; display:block; }
.card input[type=text] { padding:6px 7px; font-size:12px; }
.card .acts { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
.lau { display:grid; grid-template-columns:90px 1fr; gap:12px; border:1px solid var(--line); background:var(--raise); padding:10px; margin-bottom:10px; }
.lau .thumb { width:90px; aspect-ratio:1; }
.svcbox { border:1px solid var(--line); background:var(--raise); padding:12px; margin-bottom:10px; }
.grp { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
.hint { color:var(--faint); font-size:12px; }
.range { display:flex; align-items:center; gap:10px; }
.range input[type=range] { flex:1; accent-color:var(--steel); }
.range output { width:42px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; }
.color { display:flex; align-items:center; gap:10px; }
.color input[type=color] { width:46px; height:34px; padding:0; border:1px solid var(--line); background:none; }
.pv { display:flex; flex-direction:column; min-width:0; background:#050607; }
.pvbar { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); }
.pvbar .btn.on { border-color:var(--steel); color:#fff; }
.pvbar .sp { flex:1; }
.pvwrap { flex:1; min-height:0; display:flex; justify-content:center; align-items:stretch; padding:14px; }
.pvwrap iframe { border:1px solid var(--line); background:#000; width:100%; height:100%; transition:width .2s; }
.pvwrap.phone iframe { width:390px; max-width:100%; }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.78); display:grid; place-items:center; z-index:50; padding:20px; }
.dialog { width:min(520px, 100%); background:var(--panel); border:1px solid var(--line); padding:26px; }
.dialog h3 { margin:0 0 10px; font:700 12px/1.3 Syncopate, sans-serif; letter-spacing:.16em; text-transform:uppercase; }
.dialog p { color:var(--dim); margin:0 0 14px; }
.dialog .acts { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
.steps { margin:0 0 4px; padding-left:18px; color:var(--dim); }
.steps li { margin:5px 0; }
.err { color:var(--bad); }
.okc { color:var(--ok); }
.prog { height:3px; background:var(--line); margin:14px 0 6px; }
.prog i { display:block; height:100%; width:0; background:var(--steel-hi); transition:width .25s; }
@media (max-width: 1180px) { .body { grid-template-columns:200px 1fr; } .pv { display:none; } .main { border-right:0; } }
@media (max-width: 720px) { .body { grid-template-columns:1fr; grid-template-rows:auto 1fr; } .side { border-right:0; border-bottom:1px solid var(--line); max-height:34vh; } .top .status { display:none; } .row2, .row3 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Arondyte <i>/</i> Editor</div>
    <div class="sp"></div>
    <div class="status" id="status">Loading…</div>
    <button class="btn" id="discard" type="button" disabled>Discard changes</button>
    <button class="btn pri" id="publish" type="button" disabled>Publish</button>
  </header>
  <div class="body">
    <nav class="side" id="side" aria-label="Sections"></nav>
    <main class="main" id="main"></main>
    <section class="pv" id="pv">
      <div class="pvbar">
        <button class="btn sm on" id="pvWide" type="button">Wide</button>
        <button class="btn sm" id="pvPhone" type="button">Phone</button>
        <div class="sp"></div>
        <span class="hint">Live preview of your unpublished edits</span>
      </div>
      <div class="pvwrap" id="pvwrap"><iframe id="frame" title="Site preview"></iframe></div>
    </section>
  </div>
</div>
<div id="modal"></div>

<script>
(function () {

  var state = { content: null, orig: "", pending: {}, autoSlug: {}, sel: { t: "film", key: null }, conn: loadConn(), sourceLabel: "", busy: false };

  /* ---------- helpers ---------- */
  function $(s, r) { return (r || document).querySelector(s); }

  function add(el, c) {

  function slugify(t) { return String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
  function uniqueSlug(base, exceptKey) {
    var s = base || "film", n = 2, taken = function (x) { return state.content.films.some(function (f) { return f.key !== exceptKey && f.slug === x; }); };
    while (taken(s)) s = (base || "film") + "-" + n++;

  }
  function uid() { return Math.random().toString(36).slice(2, 8); }
  function slug(t) { return String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "film"; }
  function bytes(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
  function loadConn() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } }
  function saveConn() { try { localStorage.setItem(LS, JSON.stringify(state.conn)); } catch (e) {} }

    else if (d) { statusEl.textContent = "Unpublished changes"; statusEl.className = "status dirty"; }

    pubBtn.disabled = !d || state.busy; disBtn.disabled = !d || state.busy;
  }
  var pvTimer;
  function touch() { refreshStatus(); clearTimeout(pvTimer); pvTimer = setTimeout(reloadPreview, 700); }

  /* ---------- preview ---------- */
  var frame = $("#frame");
  function previewContent() {
    return JSON.parse(JSON.stringify(state.content, function (k, v) { return (typeof v === "string" && state.pending[v]) ? state.pending[v].url : v; }));
  }
  function reloadPreview() {

    } catch (e) {}

  $("#pvWide").addEventListener("click", function () { $("#pvwrap").className = "pvwrap"; $("#pvWide").classList.add("on"); $("#pvPhone").classList.remove("on"); });

    return wrap(label, el, o.help);
  }
  function lines(label, get, set, o) {
    o = o || {};
    var el = h("textarea", { rows: o.rows || 5, placeholder: o.ph || "" });
    el.value = get();

  }
  function check(label, obj, prop, after) {

  /* ---------- sidebar ---------- */
  function renderSide() {
    var side = $("#side"); side.innerHTML = "";
    add(side, h("h4", { text: "Films" }));
    state.content.films.forEach(function (f) {
      var on = state.sel.t === "film" && state.sel.key === f.key;
      add(side, h("button", { class: "item" + (on ? " on" : ""), type: "button", onclick: function () { select({ t: "film", key: f.key }); } },
        h("span", { text: f.title || "Untitled" }), h("small", { text: f.soon ? "soon" : (f.year || "") })));
    });

    add(side, h("h4", { text: "Pages" }));

    });

  /* ---------- main renderers ---------- */

    else if (t === "contact") renderContact(m);

  }

  function renderFilm(m, f) {

    slugIn.addEventListener("blur", function () { slugIn.value = f.slug || ""; });

    var basics = h("fieldset", {}, h("legend", { text: "Basics" }),

        return pr.then(function () {
          prog(n, total, "Uploading " + p.split("/").pop() + " (" + (n - 1) + " of " + files.length + ")…");
          return blobToB64(state.pending[p].blob).then(function (b64) { return gh("/git/blobs", { method: "POST", body: { content: b64, encoding: "base64" } }); })
            .then(function (b) { entries.push({ path: p, mode: "100644", type: "blob", sha: b.sha }); n++; });
        });
      }, Promise.resolve());
    }).then(function () {
      prog(n, total, "Saving text changes…");
      return gh("/git/blobs", { method: "POST", body: { content: strToB64(body), encoding: "base64" } });
    }).then(function (b) {
      entries.push({ path: "content.js", mode: "100644", type: "blob", sha: b.sha }); prog(++n, total, "Creating the update…");
      return gh("/git/trees", { method: "POST", body: { base_tree: baseTree, tree: entries } });
    }).then(function (t) {
      return gh("/git/commits", { method: "POST", body: { message: "Update site content (Arondyte editor)", tree: t.sha, parents: [headSha] } });
    }).then(function (c) {
      prog(++n, total, "Publishing…");
      return gh("/git/refs/heads/" + branch, { method: "PATCH", body: { sha: c.sha } });
    }).then(function () {
      prog(total, total, "Saved. Waiting for the site to update (usually under a minute)…");
      files.forEach(function (p) { /* keep blobs for preview until reload */ });
      state.orig = JSON.stringify(state.content); state.busy = false; refreshStatus("Published; site is updating…", "ok");
      return waitLive(stamp, line);
    }).then(function (live) {
      line.textContent = live ? "Live ✓ Your changes are on the site." : "Saved. The site can take a couple more minutes to show it.";
      line.className = live ? "okc" : "hint";
      dlg.appendChild(h("div", { class: "acts" }, h("button", { class: "btn pri", type: "button", text: "Done", onclick: close })));
      refreshStatus();
    }).catch(function (e) {
      state.busy = false; refreshStatus();
      var msg = e.status === 401 || e.status === 403 ? "GitHub refused the token. Reconnect with a token that has Contents: Read and write." : e.message;
      line.className = "err"; line.textContent = "Couldn't publish. " + msg;
      dlg.appendChild(h("div", { class: "acts" }, h("button", { class: "btn", type: "button", text: "Close", onclick: close })));
    });
  }
  function waitLive(stamp, line) {
    var tries = 0;
    return new Promise(function (res) {
      (function poll() {
        tries++;
        fetch("/content.js?_=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
          if (t.indexOf(stamp) > -1) res(true); else if (tries > 36) res(false); else setTimeout(poll, 5000);
        }).catch(function () { if (tries > 36) res(false); else setTimeout(poll, 5000); });
      })();
    });
  }

  /* ---------- load ---------- */
  function loadContent(fromGitHub) {
    var p;
    if (state.conn.token && fromGitHub !== false) {
      p = gh("/contents/content.js?ref=" + (state.conn.branch || DEFAULT_BRANCH), { accept: "application/vnd.github.raw+json", raw: true })
        .then(function (t) { state.sourceLabel = "Loaded from GitHub (latest)"; return t; })
        .catch(function () { return siteText(); });
    } else p = siteText();
    return p.then(function (t) {
      state.content = parseContent(t); state.content.films.forEach(function (f) { if (!f.slug) f.slug = slugify(f.title) || f.key; }); state.orig = JSON.stringify(state.content); state.pending = {}; state.autoSlug = {};
      var films = state.content.films; state.sel = { t: "film", key: films[0] ? films[0].key : null };
      renderSide(); renderMain(); refreshStatus(); reloadPreview();
    }).catch(function (e) { $("#main").textContent = "Couldn't load the site content: " + e.message; refreshStatus("Load failed", ""); });
  }
  function siteText() { state.sourceLabel = "Loaded from the live site"; return fetch("/content.js?_=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("content.js not found"); return r.text(); }); }

  pubBtn.addEventListener("click", publish);
  disBtn.addEventListener("click", function () { if (confirm("Discard all unpublished changes?")) { state.content = JSON.parse(state.orig); state.pending = {}; state.sel = { t: "film", key: state.content.films[0] ? state.content.films[0].key : null }; renderSide(); renderMain(); refreshStatus(); reloadPreview(); } });
  window.addEventListener("beforeunload", function (e) { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });
  loadContent();
})();
</script>
</body>
</html>
